services:
  # ── 1. Base de datos PostgreSQL 16 ─────────────────────────
  nna-postgres:
    image: postgres:16-alpine
    container_name: nna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nna_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nna_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-nna_auth_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nna-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nna_admin} -d ${POSTGRES_DB:-nna_auth_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Servicio de recolección y análisis programado ───────
  nna-analyzer:
    build: .
    container_name: nna-analyzer
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - LOGS_DIR=/app/logs
      - TZ=America/Mexico_City
      - POSTGRES_HOST=nna-postgres
    networks:
      - nna-network
    depends_on:
      nna-postgres:
        condition: service_healthy
    command: [ "python", "scheduler.py", "schedule" ]

  # ── 3. Aplicación Web NNA Monitor (Flask + Gunicorn) ───────
  nna-webapp:
    build: .
    container_name: nna-webapp
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - LOGS_DIR=/app/logs
      - TZ=America/Mexico_City
      - POSTGRES_HOST=nna-postgres
    networks:
      - nna-network
    depends_on:
      nna-postgres:
        condition: service_healthy
      nna-analyzer:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    command: [ "gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "300", "wsgi:app" ]

networks:
  nna-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
