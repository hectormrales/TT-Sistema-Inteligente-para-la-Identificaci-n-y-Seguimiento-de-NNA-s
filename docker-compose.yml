services:
  # ── Base de datos PostgreSQL ──────────────────────────────
  nna-postgres:
    image: postgres:16-alpine
    container_name: nna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nna-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Servicio de análisis programado ───────────────────────
  nna-analyzer:
    build: .
    container_name: nna-analyzer
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - LOGS_DIR=/app/logs
      - TZ=America/Mexico_City
    networks:
      - nna-network
    command: ["python", "scheduler.py", "schedule"]

  # ── Aplicación web Flask ──────────────────────────────────
  nna-webapp:
    build: .
    container_name: nna-webapp
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - LOGS_DIR=/app/logs
      - TZ=America/Mexico_City
      - POSTGRES_HOST=nna-postgres
    networks:
      - nna-network
    depends_on:
      nna-postgres:
        condition: service_healthy
      nna-analyzer:
        condition: service_started
    command: ["python", "wsgi.py"]

networks:
  nna-network:
    driver: bridge

volumes:
  pgdata:
    driver: local